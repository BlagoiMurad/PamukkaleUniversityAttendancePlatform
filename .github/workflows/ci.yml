name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attendance
          POSTGRES_PASSWORD: attendance
          POSTGRES_DB: attendance_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://attendance:attendance@localhost:5432/attendance_test
      TEST_DATABASE_URL: postgresql://attendance:attendance@localhost:5432/attendance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run db:generate -w apps/api
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run typecheck
      - run: npm test -w apps/api
      - run: npm test -w apps/web
      - run: npm run build
